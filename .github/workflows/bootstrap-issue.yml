name: One-shot skill bootstrap

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  bootstrap:
    if: github.event.issue.title == '[bootstrap-skill]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify, expand, test, and publish
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/bootstrap-issue.yml /tmp/bootstrap-issue.yml
          cat payload/part-* > /tmp/repo.tar.xz.b64
          base64 --decode /tmp/repo.tar.xz.b64 > /tmp/repo.tar.xz
          echo "728b8aa14382f12e1dcb35c6bdb44bdb4fefe331a50383603f53d059781feb95  /tmp/repo.tar.xz" | sha256sum --check -
          mkdir -p /tmp/repo-expanded
          tar -xJf /tmp/repo.tar.xz -C /tmp/repo-expanded
          test -f /tmp/repo-expanded/README.md
          test -f /tmp/repo-expanded/.codex-plugin/plugin.json
          test -f /tmp/repo-expanded/skills/roblox-vibe-os-studio-native/SKILL.md
          (
            cd /tmp/repo-expanded
            python -m unittest discover -s tests -v
            python -m compileall -q skills/roblox-vibe-os-studio-native/scripts
          )
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/repo-expanded/. .
          mkdir -p .github/workflows
          cp /tmp/bootstrap-issue.yml .github/workflows/bootstrap-issue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Roblox Vibe OS Studio Native skill"
          git push
      - name: Close bootstrap issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue close "$ISSUE_URL" --comment "Bootstrap completed and the validated public skill was published."
