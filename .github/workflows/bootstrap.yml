name: Bootstrap public skill repository

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roblox-skill-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci: bootstrap public skill repository'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify, expand, test, and publish the validated package
        shell: bash
        run: |
          set -euo pipefail

          test -d payload
          mapfile -t parts < <(find payload -maxdepth 1 -type f -name 'part-*' | sort)
          if [ "${#parts[@]}" -ne 17 ]; then
            echo "Expected exactly 17 payload parts, found ${#parts[@]}."
            printf '%s\n' "${parts[@]}"
            exit 1
          fi

          mkdir -p /tmp/bootstrap-preserve
          cp -a .github/workflows /tmp/bootstrap-preserve/workflows

          cat "${parts[@]}" > /tmp/repo.tar.xz.b64
          base64 --decode /tmp/repo.tar.xz.b64 > /tmp/repo.tar.xz
          echo "728b8aa14382f12e1dcb35c6bdb44bdb4fefe331a50383603f53d059781feb95  /tmp/repo.tar.xz" | sha256sum --check -

          rm -rf /tmp/repo-expanded
          mkdir -p /tmp/repo-expanded
          tar -xJf /tmp/repo.tar.xz -C /tmp/repo-expanded

          test -f /tmp/repo-expanded/README.md
          test -f /tmp/repo-expanded/.codex-plugin/plugin.json
          test -f /tmp/repo-expanded/skills/roblox-vibe-os-studio-native/SKILL.md

          (
            cd /tmp/repo-expanded
            python -m unittest discover -s tests -v
            python -m compileall -q skills/roblox-vibe-os-studio-native/scripts
          )

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/repo-expanded/. .
          rm -rf .github/workflows
          mkdir -p .github
          cp -a /tmp/bootstrap-preserve/workflows .github/workflows

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Validated package already matches the repository; nothing to publish."
            exit 0
          fi

          if ! git diff --cached --quiet -- .github/workflows; then
            echo "Workflow files changed unexpectedly; refusing to publish."
            git diff --cached -- .github/workflows
            exit 1
          fi

          git commit -m "feat: publish Roblox Vibe OS Studio Native skill"
          git push
